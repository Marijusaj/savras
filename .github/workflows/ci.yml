# What has to be true of every push, so that a red mark means something.
#
# The tests start a real `svr` in a real pty and read what it paints, so they
# need a runner and not a container — that is why this is the whole matrix
# rather than one job on Linux.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # A whole run takes a few minutes. A pane test that waits on a panel that
    # never goes quiet once held a runner for the full six-hour default, and a
    # red mark after six hours says nothing a red mark after twenty does not.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The version in Cargo.toml is a promise. `ratatui-core` and `notify` both
  # ask for 1.88, so it is one that moves and needs checking.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --all-targets

  # Advisories are the half of a dependency bump that nothing else notices.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
