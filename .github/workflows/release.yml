# Pushing a tag vX.Y.Z is the whole release: a GitHub release for the tag, and
# the Homebrew formula in Marijusaj/homebrew-tap pointed at it.
#
# Needs one secret, TAP_TOKEN: a fine-grained token with Contents: read and
# write on Marijusaj/homebrew-tap and nothing else. GITHUB_TOKEN cannot push to
# another repository.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A tag that disagrees with Cargo.toml would ship a formula whose test
      # fails: `svr --version` prints the crate version, not the tag.
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      # The same archive Homebrew will download. The token only matters while
      # the repository is private; the bytes are identical either way.
      - id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          echo "sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Marijusaj/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA256}/g" \
            packaging/homebrew/savras.rb > tap/Formula/savras.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/savras.rb
          git commit -m "savras ${VERSION}"
          git push origin HEAD
